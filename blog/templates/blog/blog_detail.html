{% extends 'blog/base.html' %}
{% block title %}{{ blog.title }}{% endblock %}
{% block content %}
<a href="{% url 'blog:list' %}">К списку статей</a>
<article>
<h1>{{ blog.title }}</h1>
<div>{{ blog.description|linebreaks }}</div>
<p class="meta">Автор: {{ blog.author }} · Просмотры: {{ blog.likes }}</p>
<div class="actions"><a href="{% url 'blog:update' blog.id %}">Редактировать</a><a href="{% url 'blog:delete' blog.id %}">Удалить</a></div>
</article>
{% endblock %}
