<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ blog.title }}</title>
</head>
<body>
    <main>
        <p><a href="{% url 'blog:list' %}">К списку статей</a></p>
        <article>
            <h1>{{ blog.title }}</h1>
            <p>{{ blog.description }}</p>
            <p>Автор: {{ blog.author }}</p>
            <p>Просмотры: {{ blog.likes }}</p>
        </article>
    </main>
</body>
</html>
